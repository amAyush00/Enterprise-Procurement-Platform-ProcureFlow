<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    
    <!-- Accent Highlight Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>

    <!-- Subtle Drop Shadow -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle Base Container -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" filter="url(#dropShadow)" />
  
  <!-- Subtle inner border -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="13.5" fill="none" stroke="#60a5fa" stroke-width="1" stroke-opacity="0.4" />

  <!-- Procurement Box / Flow Icon -->
  <g transform="translate(14, 14)">
    <!-- Isometric Cube / Enterprise Box Top -->
    <path d="M18 4 L31 11 L18 18 L5 11 Z" fill="url(#accentGrad)" />
    
    <!-- Left Face -->
    <path d="M5 11 L18 18 L18 31 L5 24 Z" fill="#ffffff" fill-opacity="0.95" />
    
    <!-- Right Face -->
    <path d="M18 18 L31 11 L31 24 L18 31 Z" fill="#cbd5e1" fill-opacity="0.95" />
    
    <!-- Inner Checkmark / Procurement Approval Seal -->
    <path d="M13 14.5 L16.5 18 L24 9.5" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
